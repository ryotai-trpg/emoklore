# gitフック定義（スキップしたい場合は `git commit --no-verify` / `git push --no-verify`。非推奨）
# - pre-commit: stagedファイルにBiome（format+lint）を自動適用し、テンプレートと翻訳を検査する
# - commit-msg: コミットメッセージがdocs/contributing.mdの規約に沿うか検査する
# - pre-push: 単体テストと型チェックを回す
pre-commit:
  jobs:
    - name: biome
      glob: "*.{ts,mts,cts,js,mjs,cjs,json,jsonc,css}"
      run: npx biome check --write --no-errors-on-unmatched {staged_files}
      stage_fixed: true

    # BiomeはHandlebarsを扱えないので、hbsは専用のチェックに回す。
    # 参照の検査はリポジトリ全体を見る必要があるため {staged_files} は渡さない
    - name: templates
      glob: "*.hbs"
      run: npm run check:templates

    # manifest / download のURLは間違えても手元では何も起きず、配ったあとに壊れる。
    # version を上げて download を直し忘れるのが典型なので、コミットの時点で見る
    - name: manifest-urls
      glob: "system.json"
      run: npm run check:manifest-urls

    # 上のbiomeジョブのglobがjsonを含むため、lang/だけを触ると整形しか走らない。
    # 2ファイルの突き合わせと表記の検査はどちらも全体を見るのでファイルを渡さない。
    # module/ も引き金にするのは、通知に渡すキーの検査が呼び出し側を読むため
    - name: lang
      glob:
        - "lang/*.json"
        - "module/**/*.ts"
      run: npm run check:lang

    # キーと参照側の突き合わせ。lang・テンプレート・moduleのどれを触っても
    # 片側だけ動かせば壊れるので、3つとも引き金にする。全体を見るチェック
    - name: i18n
      glob:
        - "lang/*.json"
        - "*.hbs"
        - "module/**/*.ts"
        - "system.json"
      run: npm run check:i18n

    # スキーマ表とconfigのテーブル・翻訳の突き合わせ。どれか片側だけ動かせば壊れるので、
    # check-schema-doc.mjs が読むファイルを全部引き金にする。全体を見るチェック
    - name: schema-doc
      glob:
        - "module/config/*.ts"
        - "docs/data-model.md"
        - "docs/active-effect.md"
        - "lang/ja.json"
      run: npm run check:schema-doc

    # 層とimportの方向。仕様は docs/code-design.md の表なので、コードと表の
    # どちらを触っても走らせる。全体を見るチェックなのでファイルは渡さない
    - name: layers
      glob:
        - "module/**/*.ts"
        - "docs/code-design.md"
      run: npm run check:layers

    # ロードマップが引くIssueの状態との突き合わせ。唯一ネットワークに出るチェックで、
    # APIに到達できないときは落とさず通す（コミットをオフラインで止めない）
    - name: roadmap
      glob: "docs/roadmap.md"
      run: npm run check:roadmap

    # プラグインの挙動が変わる時期を明示的に決めたいので、Biomeは完全固定にしている。
    # 範囲指定に戻していないかを package.json を触った時点で見る
    - name: biome-version
      glob: "package.json"
      run: npm run check:biome-version

pre-push:
  jobs:
    # CIで見ているもののうち、依存も本体ソースも要らず一瞬で終わるもの（合わせて2秒）。
    # フォークからのPRはCIの型チェックが本体ソースを用意できずに飛ぶことがあるので、
    # 手元で一度は通す口をここに置く（Issue #56）
    - name: test
      run: npm test

    - name: typecheck
      # 本体ソースが無ければ型チェックのしようがない。pushは止めずに飛ばす。
      # foundry そのものではなく foundry/client を見るのは、Foundryを移動して
      # symlinkが切れた場合も拾うため（-d はリンク先の実在まで見る）
      run: |
        if [ ! -d foundry/client ]; then
          echo "foundry/ が無いので型チェックを飛ばす（npm run link:foundry で用意できる）"
          exit 0
        fi
        npm run typecheck

commit-msg:
  jobs:
    - name: message-format
      run: |
        first=$(head -n1 "{1}")
        case "$first" in
          Merge* | Revert* | fixup!* | squash!*) exit 0 ;;
        esac
        if ! printf '%s' "$first" | grep -qE '^(feat|fix|refactor|style|test|docs|ci|chore): .+'; then
          echo "NG: コミットメッセージの1行目は 'prefix: summary' 形式で書く（docs/contributing.md参照）"
          echo "    prefix: feat | fix | refactor | style | test | docs | ci | chore"
          echo "    例: feat: add resonance roll dialog"
          exit 1
        fi
