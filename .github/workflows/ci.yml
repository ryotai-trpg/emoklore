name: CI

on:
  push:
    branches: [develop, main]
  pull_request:

jobs:
  biome:
    name: Format & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # プラグイン（tools/*.grit）を使うのでバージョンを固定する。
      # package.json の @biomejs/biome と揃えること
      - uses: biomejs/setup-biome@v2
        with:
          version: 2.5.4
      - run: biome ci .

  build:
    name: Build & Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Build system
        run: npm run build
      - name: Check lang key parity
        run: npm run check:lang
      - name: Check Handlebars templates
        run: npm run check:templates
      - name: Build docs
        run: npm run docs:build

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    # 公開リポジトリのActions cacheはフォークPRからrestoreできるため、フォークPRでは実行しない
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    env:
      # ローカルのFoundry本体を更新したら合わせて上げる（世代はsystem.jsonのcompatibilityと対応）
      FOUNDRY_BUILD: "365"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Restore Foundry sources
        id: foundry-cache
        uses: actions/cache@v4
        with:
          path: foundry
          key: foundry-types-${{ env.FOUNDRY_BUILD }}
      - name: Fetch Foundry sources
        if: steps.foundry-cache.outputs.cache-hit != 'true'
        run: node tools/fetch-foundry.mjs
        env:
          FOUNDRY_USERNAME: ${{ secrets.FOUNDRY_USERNAME }}
          FOUNDRY_PASSWORD: ${{ secrets.FOUNDRY_PASSWORD }}
      - name: Type check
        run: npm run typecheck
