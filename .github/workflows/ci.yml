name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
  # 定期実行で回すのは typecheck と audit の2つ。
  # typecheck: Actions cacheは7日アクセスが無いと消えるので週2回触って延命する。
  #   消えるとフォーク・DependabotのPRが型チェックを飛ばすようになる。
  #   併せて develop が今も型チェックを通ることの定期確認になる
  # audit: 勧告は依存を触らなくても後から公開されるので、PRが立つのを待つと気付くのが遅れる
  schedule:
    - cron: "0 21 * * 1,4" # 月・木 06:00 JST

# 書き込みの権限は要らない。読み取りだけに絞る（issues は check:roadmap が状態を読む）
permissions:
  contents: read
  issues: read

# 同じブランチへ続けてpushしたときは古い実行を打ち切る。
# ただし develop / main への push は履歴として残したいので打ち切らない
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  biome:
    name: Format & Lint
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      # lockfileが入れたBiomeをそのまま使う。プラグイン（tools/*.grit）の挙動が
      # 手元とCIで食い違わないことを、バージョンの一致ではなく同一性で保証する。
      # setup-biome でバージョンを書くと、Dependabotが package.json だけを上げた週に
      # 必ず食い違って落ちていた
      - run: npx biome ci .

  build:
    name: Build & Checks
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Build system
        run: npm run build
      - name: Check Biome version sync
        run: npm run check:biome-version
      - name: Check lang key parity
        run: npm run check:lang
      - name: Check i18n key references
        run: npm run check:i18n
      - name: Check Handlebars templates
        run: npm run check:templates
      - name: Check schema doc
        run: npm run check:schema-doc
      - name: Check layer imports
        run: npm run check:layers
      - name: Check manifest URLs
        run: npm run check:manifest-urls
      # 到達できなければスキップして通る設計だが、CIでは素の60回/時の
      # レート制限に乗らないようトークンを渡して確実に照合させる
      - name: Check roadmap issue states
        run: npm run check:roadmap
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Build docs
        run: npm run docs:build

  # scheduleでも回す。勧告は依存を触らなくても後から公開されるので、PRが立つのを
  # 待っていると気付くのが遅れる（nanoidのhighが3週間見過ごされた）
  audit:
    name: Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      # 本システムは dependencies が空で、脆弱性が出るのは開発時だけに使う
      # devDependencies（vite / rollup など）。dist に混入しないぶん実害は小さいので、
      # 無関係な勧告でPRが止まらないよう high 以上でのみ落とす。
      # moderate 以下は手元の `npm audit` で見る
      - name: Audit dependencies
        run: npm audit --audit-level=high

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    env:
      # ローカルのFoundry本体を更新したら合わせて上げる（世代はsystem.jsonのcompatibilityと対応）
      FOUNDRY_BUILD: "366"
      # フォークPRとDependabotのPRにはsecretsが渡らない（Dependabotは専用のsecret storeを見る）。
      # secretsコンテキストは if: から読めないので、有無だけをここに写して判定に使う
      HAS_CREDENTIALS: ${{ secrets.FOUNDRY_USERNAME != '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      # cacheはフォークPRからでもbase/デフォルトブランチのぶんをrestoreできる
      # （できないのは新規cacheの保存のほう）。scheduleで週2回触って消さないようにしてある
      - name: Restore Foundry sources
        id: foundry-cache
        uses: actions/cache@v6
        with:
          path: foundry
          key: foundry-types-${{ env.FOUNDRY_BUILD }}
      - name: Fetch Foundry sources
        id: fetch
        if: steps.foundry-cache.outputs.cache-hit != 'true' && env.HAS_CREDENTIALS == 'true'
        run: node tools/fetch-foundry.mjs
        env:
          FOUNDRY_USERNAME: ${{ secrets.FOUNDRY_USERNAME }}
          FOUNDRY_PASSWORD: ${{ secrets.FOUNDRY_PASSWORD }}
      - name: Type check
        if: steps.foundry-cache.outputs.cache-hit == 'true' || steps.fetch.outcome == 'success'
        run: npm run typecheck
      # 飛ばしたことを緑の中に埋もれさせない。「CIが緑なので検証済み」という誤解は
      # docs/testing.md が実機検証をCIに載せない理由に挙げているもので、ここでも同じ
      - name: Note skipped type check
        if: steps.foundry-cache.outputs.cache-hit != 'true' && steps.fetch.outcome != 'success'
        run: |
          echo "::warning::本体ソースを用意できなかったため型チェックを飛ばした（cacheミス、かつsecretsの無いPR）"
