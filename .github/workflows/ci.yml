name: CI

on:
  push:
    branches: [develop, main]
  pull_request:

# 追加の権限は要らない。読み取りだけに絞る
permissions:
  contents: read

# 同じブランチへ続けてpushしたときは古い実行を打ち切る。
# ただし develop / main への push は履歴として残したいので打ち切らない
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  biome:
    name: Format & Lint
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      # lockfileが入れたBiomeをそのまま使う。プラグイン（tools/*.grit）の挙動が
      # 手元とCIで食い違わないことを、バージョンの一致ではなく同一性で保証する。
      # setup-biome でバージョンを書くと、Dependabotが package.json だけを上げた週に
      # 必ず食い違って落ちていた
      - run: npx biome ci .

  build:
    name: Build & Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Build system
        run: npm run build
      - name: Check Biome version sync
        run: npm run check:biome-version
      - name: Check lang key parity
        run: npm run check:lang
      - name: Check i18n key references
        run: npm run check:i18n
      - name: Check Handlebars templates
        run: npm run check:templates
      - name: Check schema doc
        run: npm run check:schema-doc
      - name: Check manifest URLs
        run: npm run check:manifest-urls
      - name: Build docs
        run: npm run docs:build

  audit:
    name: Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      # 本システムは dependencies が空で、脆弱性が出るのは開発時だけに使う
      # devDependencies（vite / rollup など）。dist に混入しないぶん実害は小さいので、
      # 無関係な勧告でPRが止まらないよう high 以上でのみ落とす。
      # moderate 以下は手元の `npm audit` で見る
      - name: Audit dependencies
        run: npm audit --audit-level=high

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    # フォークPRにはsecretsが渡らないので、キャッシュミス時に fetch-foundry.mjs へ倒せない。
    # 本体ソースを用意する手段が無くなるため、ジョブごと実行しない。
    # cache自体はフォークPRからでもbase/デフォルトブランチのぶんをrestoreできるが、
    # ミスしたときに落ちるだけのジョブは置かない
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    env:
      # ローカルのFoundry本体を更新したら合わせて上げる（世代はsystem.jsonのcompatibilityと対応）
      FOUNDRY_BUILD: "365"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Restore Foundry sources
        id: foundry-cache
        uses: actions/cache@v6
        with:
          path: foundry
          key: foundry-types-${{ env.FOUNDRY_BUILD }}
      - name: Fetch Foundry sources
        if: steps.foundry-cache.outputs.cache-hit != 'true'
        run: node tools/fetch-foundry.mjs
        env:
          FOUNDRY_USERNAME: ${{ secrets.FOUNDRY_USERNAME }}
          FOUNDRY_PASSWORD: ${{ secrets.FOUNDRY_PASSWORD }}
      - name: Type check
        run: npm run typecheck
